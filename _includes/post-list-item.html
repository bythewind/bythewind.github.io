<article class="entry">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%Y.%m.%d" }}</time>
  <div>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 88 }}</p>
  </div>
  {% if include.post.categories.size > 0 %}
    <span class="entry-category">{{ include.post.categories | first }}</span>
  {% endif %}
</article>
